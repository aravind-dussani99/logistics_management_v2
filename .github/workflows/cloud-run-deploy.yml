name: CI + Build + Deploy

on:
  pull_request:
    branches: [ main ]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  PROJECT_ID: seismic-box-476911-v9
  REGION: asia-south2
  GAR_REPOSITORY: logitrack-v2
  BACKEND_SERVICE_NAME: logitrack-backend-service
  BACKEND_SERVICE_NAME_DEV: logitrack-backend-service
  LOGITRACK_SA: logitrack-sa@seismic-box-476911-v9.iam.gserviceaccount.com
  FRONTEND_API_BASE_URL: ""
  CORS_ORIGIN_PROD: ""
  CORS_ORIGIN_DEV: http://34.8.224.124
  FRONTEND_BUCKET_PROD: ""
  FRONTEND_BUCKET_DEV: logitrack-frontend
  CONFIG_BUCKET_PROD: ""
  CONFIG_BUCKET_DEV: logitrack-frontend
  ATTACHMENTS_BUCKET_PROD: ""
  ATTACHMENTS_BUCKET_DEV: logitrack-attachments
  IMAGE_NAME_BACKEND: logitrack-api
  IMAGE_NAME_BACKEND_PR: logitrack-api-pr
  CLOUDSQL_INSTANCE_CONNECTION: seismic-box-476911-v9:asia-south2:logitrack-cloudsql-v2-instance
  DB_PROXY_PORT: "5432"

jobs:
  detect-destructive-migrations:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      destructive: ${{ steps.detect.outputs.destructive }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard migrations vs schema changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "${BASE_SHA}" ]; then
            exit 0
          fi
          git fetch origin "${BASE_SHA}" --depth=1 || true
          SCHEMA_CHANGED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- backend/prisma/schema.prisma || true)
          MIGRATIONS_CHANGED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- backend/prisma/migrations || true)
          if [ -n "${SCHEMA_CHANGED}" ] && [ -z "${MIGRATIONS_CHANGED}" ]; then
            echo "Schema changed without a committed migration. Run prisma migrate and commit the new migration folder." >&2
            exit 1
          fi
      - name: Detect destructive migrations
        id: detect
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "${BASE_SHA}" ]; then
            echo "destructive=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git fetch origin "${BASE_SHA}" --depth=1 || true
          CHANGED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- 'backend/prisma/migrations/**/migration.sql' || true)
          if [ -z "${CHANGED}" ]; then
            echo "destructive=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          PATTERN='DROP TABLE|DROP COLUMN|DROP TYPE|ALTER TABLE[^;]*DROP|TRUNCATE'
          MATCHES=$(grep -nE "${PATTERN}" ${CHANGED} || true)
          if [ -z "${MATCHES}" ]; then
            echo "destructive=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          {
            echo "${MATCHES}"
          } > destructive-migrations.txt
          {
            echo "### Destructive migration review required"
            echo ""
            echo "The following migration files include destructive operations:"
            echo ""
            echo "\`\`\`"
            echo "${MATCHES}"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
          echo "Destructive migration details:"
          echo "${MATCHES}"
          echo "destructive=true" >> $GITHUB_OUTPUT
      - name: Upload destructive migration report
        if: steps.detect.outputs.destructive == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: destructive-migrations-report
          path: destructive-migrations.txt
      - name: Post destructive migration summary to PR
        if: steps.detect.outputs.destructive == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('destructive-migrations.txt', 'utf8');
            const summary = [
              '### Destructive migration review required',
              '',
              'The following statements were detected:',
              '',
              '```',
              body.trim(),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: summary,
            });

  approve-destructive-migrations:
    runs-on: ubuntu-latest
    needs: [detect-destructive-migrations]
    if: needs.detect-destructive-migrations.outputs.destructive == 'true'
    environment: destructive-migrations
    steps:
      - name: Await approval
        run: echo "Destructive migration approval granted."

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install Dependencies
        run: npm ci --include=optional
        working-directory: frontend
      - name: Lint
        run: npm run lint --if-present
        working-directory: frontend
      - name: Format
        run: npm run format --if-present
        working-directory: frontend

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install Dependencies
        run: npm install
        working-directory: backend
      - name: Lint
        run: npm run lint --if-present
        working-directory: backend
      - name: Format
        run: npm run format --if-present
        working-directory: backend

  build-frontend-pr:
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, detect-destructive-migrations, approve-destructive-migrations]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.lint-frontend.result == 'success' &&
      needs.lint-backend.result == 'success' &&
      needs.detect-destructive-migrations.result == 'success' &&
      (needs.detect-destructive-migrations.outputs.destructive != 'true' || needs.approve-destructive-migrations.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies
        run: npm ci --include=optional
        working-directory: frontend
      - name: Ensure Rollup Linux Binary
        run: npm install @rollup/rollup-linux-x64-gnu@4.54.0 --no-save
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://example.com

  build-backend-pr:
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, detect-destructive-migrations, approve-destructive-migrations]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.lint-frontend.result == 'success' &&
      needs.lint-backend.result == 'success' &&
      needs.detect-destructive-migrations.result == 'success' &&
      (needs.detect-destructive-migrations.outputs.destructive != 'true' || needs.approve-destructive-migrations.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies
        run: npm install
        working-directory: backend
      - name: Build
        run: npm run build --if-present
        working-directory: backend

  docker-build-frontend-pr:
    runs-on: ubuntu-latest
    needs: [build-frontend-pr]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Frontend Docker Image
        run: docker build -t logitrack-frontend-pr ./frontend

  docker-build-backend-pr:
    runs-on: ubuntu-latest
    needs: [build-backend-pr]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Backend Docker Image
        run: docker build -t logitrack-backend-pr ./backend

  build-push-deploy-backend:
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      backend_url: ${{ steps.capture-backend-url.outputs.backend_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm install
        working-directory: backend

      - name: Test
        run: npm test --if-present
        working-directory: backend

      - name: Authenticate to Google Cloud (Cloud SQL)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.LOGITRACK_CLOUD_SQL_SA }}
          service_account: ${{ vars.LOGITRACK_CLOUD_SQL_SA_SA }}

      - name: Start Cloud SQL Proxy (main)
        env:
          CLOUDSQL_INSTANCE_CONNECTION: ${{ env.CLOUDSQL_INSTANCE_CONNECTION }}
          DB_PROXY_PORT: ${{ env.DB_PROXY_PORT }}
        run: |
          if [ -z "${CLOUDSQL_INSTANCE_CONNECTION}" ]; then
            echo "CLOUDSQL_INSTANCE_CONNECTION is required for main migrations" >&2
            exit 1
          fi
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.4/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${CLOUDSQL_INSTANCE_CONNECTION}" --port "${DB_PROXY_PORT}" > proxy-main.log 2>&1 &
          sleep 3
      - name: Verify Cloud SQL Proxy (main)
        run: |
          for i in $(seq 1 10); do
            if (echo > /dev/tcp/127.0.0.1/${DB_PROXY_PORT}) >/dev/null 2>&1; then
              echo "Cloud SQL Proxy is accepting connections on ${DB_PROXY_PORT}"
              exit 0
            fi
            echo "Waiting for Cloud SQL Proxy..."
            sleep 2
          done
          if [ -f proxy-main.log ]; then
            echo "--- Cloud SQL Proxy (main) log ---"
            cat proxy-main.log
          fi
          echo "Cloud SQL Proxy did not become ready" >&2
          exit 1
      - name: Check DB connectivity (main)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL_DEV secret is required for main migrations" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import sys
          import urllib.parse
          url = os.environ.get("DATABASE_URL", "")
          if url.count("@") > 1:
            print("DATABASE_URL appears to contain an unencoded '@' in the password. URL-encode it.")
            sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          userinfo = parsed.netloc.split("@")[0] if "@" in parsed.netloc else ""
          user, _, password = userinfo.partition(":")
          allowed = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~%")
          def bad(value):
            return any(ch not in allowed for ch in value)
          if bad(user) or bad(password):
            print("DATABASE_URL contains unencoded special characters. URL-encode username/password.")
            sys.exit(1)
          PY
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          DB_URL_NO_SCHEMA="${DATABASE_URL%\?schema=public}"
          for i in $(seq 1 5); do
            if psql "${DB_URL_NO_SCHEMA}" -c "SELECT 1;" >/dev/null 2>&1; then
              echo "Database connection successful."
              exit 0
            fi
            echo "Waiting for database connection..."
            sleep 2
          done
          if [ -f proxy-main.log ]; then
            echo "--- Cloud SQL Proxy (main) log ---"
            cat proxy-main.log
          fi
          psql "${DB_URL_NO_SCHEMA}" -c "SELECT 1;"

      - name: Run Prisma migrations (main)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL_DEV secret is required for main migrations" >&2
            exit 1
          fi
          if [ -z "${CLOUDSQL_INSTANCE_CONNECTION}" ]; then
            echo "CLOUDSQL_INSTANCE_CONNECTION is required for main migrations" >&2
            exit 1
          fi
          npm install
          npx prisma generate
          npx prisma migrate deploy

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.LOGITRACK_SA_KEY }}
          service_account: ${{ vars.LOGITRACK_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Ensure GAR repository
        run: |
          if ! gcloud artifacts repositories describe "${GAR_REPOSITORY}" --location "${REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${GAR_REPOSITORY}" \
              --location "${REGION}" \
              --repository-format docker \
              --description "Docker repository for LogiTrack"
          fi

      - name: Build and Push Backend Image (main)
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME_BACKEND}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          docker build -t "${IMAGE_URI}" ./backend
          docker push "${IMAGE_URI}"
      - name: Verify backend image (main)
        run: |
          if [ -z "${IMAGE_URI}" ]; then
            echo "IMAGE_URI is empty. Backend image build did not run." >&2
            exit 1
          fi

      - name: Deploy Backend to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV_CLOUDRUN }}
          ADMIN_RESET_TOKEN: ${{ secrets.ADMIN_RESET_TOKEN_DEV }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL_DEV_CLOUDRUN secret is required for main deployments" >&2
            exit 1
          fi
          if [ -z "${ADMIN_RESET_TOKEN}" ]; then
            echo "ADMIN_RESET_TOKEN_DEV secret is required for main deployments" >&2
            exit 1
          fi
          if [ -z "${LOGITRACK_SA}" ]; then
            echo "LOGITRACK_SA is required to set the Cloud Run runtime service account" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse, parse_qs

          url = os.environ.get("DATABASE_URL", "")
          parsed = urlparse(url)
          if not parsed.hostname:
            print("DATABASE_URL_PROD_CLOUDRUN is missing a host. Use localhost for Prisma compatibility.")
            sys.exit(1)
          qs = parse_qs(parsed.query)
          if "host" not in qs:
            print("DATABASE_URL_PROD_CLOUDRUN is missing host=/cloudsql/INSTANCE in query params.")
            sys.exit(1)
          PY
          gcloud run deploy "${BACKEND_SERVICE_NAME}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --service-account "${LOGITRACK_SA}" \
            --port 8080 \
            --add-cloudsql-instances "${CLOUDSQL_INSTANCE_CONNECTION}" \
            --set-env-vars "CORS_ORIGIN=${CORS_ORIGIN_DEV},CONFIG_BUCKET=${CONFIG_BUCKET_DEV},ATTACHMENTS_BUCKET=${ATTACHMENTS_BUCKET_DEV},DATABASE_URL=${DATABASE_URL},ADMIN_RESET_TOKEN=${ADMIN_RESET_TOKEN}" \
            --allow-unauthenticated

      - name: Capture Backend URL (main)
        id: capture-backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe "${BACKEND_SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)')
          echo "backend_url=${BACKEND_URL}" >> $GITHUB_OUTPUT

  build-deploy-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, build-push-deploy-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci --include=optional
        working-directory: frontend

      - name: Ensure Rollup Linux Binary (main)
        run: npm install @rollup/rollup-linux-x64-gnu@4.54.0 --no-save
        working-directory: frontend

      - name: Build
        run: |
          npm run build || (rm -rf node_modules package-lock.json && npm install --include=optional && npm run build)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.FRONTEND_API_BASE_URL }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.LOGITRACK_SA_KEY }}
          service_account: ${{ vars.LOGITRACK_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Write config.json (main)
        run: |
          BACKEND_URL="${{ needs.build-push-deploy-backend.outputs.backend_url }}"
          if [ -z "${BACKEND_URL}" ]; then
            echo "Backend URL is required for config.json" >&2
            exit 1
          fi
          printf '{\n  "apiBaseUrl": "%s"\n}\n' "${BACKEND_URL}" > frontend/dist/config.json

      - name: Upload Frontend to GCS
        if: env.FRONTEND_BUCKET_DEV != ''
        run: |
          gsutil -m rsync -r -d frontend/dist "gs://${FRONTEND_BUCKET_DEV}"
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" "gs://${FRONTEND_BUCKET_DEV}/assets/**" || true
          gsutil -m setmeta -h "Cache-Control:no-cache, max-age=0" "gs://${FRONTEND_BUCKET_DEV}/index.html" "gs://${FRONTEND_BUCKET_DEV}/config.json" || true
